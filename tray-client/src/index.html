<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>竹筒肥鱼</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1115; --fg:#e6e6e6; --muted:#8b93a1;
  --line:#23262d; --card:#1a1d24; --card2:#1e222a;
  --me:#2563eb; --her:#1e222a; --her-fg:#e6e6e6;
  --accent:#7cc4ff; --input:#1a1d24; --input-line:#2a2e38;
}
body.light{
  --bg:#f6f7f9; --fg:#1f2328; --muted:#6b7280;
  --line:#e3e6ea; --card:#ffffff; --card2:#ffffff;
  --me:#2563eb; --her:#ffffff; --her-fg:#1f2328;
  --accent:#0969da; --input:#ffffff; --input-line:#d6dae0;
}
body{font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:#6b7280;flex:none}
.dot.on{background:#22c55e}
h1{font-size:13px;font-weight:600}
#st{font-size:11px;color:var(--muted)}
#theme{margin-left:auto;font-size:14px;background:none;border:0;cursor:pointer;color:var(--muted);padding:2px 6px}
#log{flex:1 1 0;min-height:100px;overflow-y:auto;padding:12px 12px 28px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:7px 11px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:14px}
.me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:4px}
.her{align-self:flex-start;background:var(--her);color:var(--her-fg);border-bottom-left-radius:4px}
.tool{align-self:flex-start;font-size:11px;padding:2px 10px;border-radius:10px;margin:1px 0 1px 4px;font-weight:500}
.t-chat{background:#1e4d7a;color:#a6dbff}
.t-mem{background:#452a70;color:#d8bcff}
.t-self{background:#1d5138;color:#96e8bb}
.t-code{background:#5c3917;color:#ffd39a}
.t-want{background:#5e2544;color:#ffb0cd}
.t-net{background:#154e4e;color:#96e8e8}
.t-draw{background:#3d2b70;color:#c9b4ff}
.t-other{background:#2f3a5e;color:#b6c6f0}
body.light .t-chat{background:#cfe8ff;color:#0a4d91}
body.light .t-mem{background:#e8dbff;color:#5b2fa8}
body.light .t-self{background:#cdf5dd;color:#15703f}
body.light .t-code{background:#ffe6c4;color:#8a4b00}
body.light .t-want{background:#ffd9e7;color:#a01d54}
body.light .t-net{background:#c9f2f2;color:#0d6363}
body.light .t-draw{background:#e0d4ff;color:#4a2fa8}
body.light .t-other{background:#dde4f7;color:#3a4a75}
footer{padding:9px 10px;border-top:1px solid var(--line);display:flex;gap:7px;flex:none}
#in{flex:1;background:var(--input);border:1px solid var(--input-line);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit;resize:none;height:40px}
#send{background:var(--me);border:0;color:#fff;border-radius:8px;padding:0 15px;font:inherit;cursor:pointer}
#send:disabled{opacity:.5}
#tip{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:28px;z-index:9}
#tip h2{font-size:16px;font-weight:600}
#tip p{font-size:13px;color:var(--muted);text-align:center;line-height:1.7}
#tip input{width:100%;background:var(--input);border:1px solid var(--input-line);color:var(--fg);border-radius:8px;padding:9px 11px;font:inherit}
#tip button{width:100%;background:var(--me);border:0;color:#fff;border-radius:8px;padding:10px;font:inherit;cursor:pointer}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>竹筒肥鱼</h1>
  <span id="st"></span>
  <button id="theme" title="切换日夜">☾</button>
</header>
<div id="log"></div>
<footer>
  <textarea id="in" placeholder="说点什么…" rows="1"></textarea>
  <button id="send">发送</button>
</footer>

<div id="tip">
  <h2>先连上服务器</h2>
  <p>填服务器地址和 token。<br>地址形如 <code>http://1.2.3.4:3081</code> 或 <code>https://xxx.trycloudflare.com</code></p>
  <input id="cfgBase" placeholder="服务器地址">
  <input id="cfgToken" placeholder="token" type="password">
  <button id="cfgSave">保存并连接</button>
</div>

<script>
const { invoke } = window.__TAURI__.core;

const log = document.getElementById('log');
const inp = document.getElementById('in');
const btn = document.getElementById('send');
const dot = document.getElementById('dot');
const st  = document.getElementById('st');
const themeBtn = document.getElementById('theme');
const tip = document.getElementById('tip');

const TOOL_ZH = {
  send_sticker:"发表情",list_stickers:"看表情库",save_sticker:"存表情",send_face:"发小黄脸",
  at_person:"艾特别人",draw_image:"画图",draw_svg:"画SVG",web_search:"搜网",web_fetch:"读网页",
  hot_news:"查热点",recall:"翻旧对话",remember_fact:"记事实",remember_person:"记人物",
  remember_self:"记想法",revise_self:"改想法",forget_self:"忘想法",my_memory:"查记忆",
  memory_index:"看记忆目录",my_digest:"看近期摘要",person_dossier:"查人物档案",
  group_recap:"看群记录",who_said:"查谁说的",view_avatar:"看头像",my_status:"看状态",
  my_activities:"看活动记录",my_adventures:"看探险记录",my_capabilities:"看能力清单",
  my_changelog:"看更新日志",my_source:"看源码片段",my_outages:"看掉线记录",my_schedule:"看排期",
  exec_sandbox:"跑代码",read_source:"读源码",note_want:"记需求",my_wants:"看需求本",
  resolve_want:"标记需求完成",drop_want:"删需求",request_feature:"申请功能",
  render_page:"做网页",add_webui_button:"加按钮",remove_webui_button:"删按钮",
  read_forward_more:"展开转发",refuse_person:"拒聊",owner_commands:"查指令清单"
};
const TOOL_KIND = {
  send_sticker:"chat",list_stickers:"chat",save_sticker:"chat",send_face:"chat",at_person:"chat",
  draw_image:"draw",draw_svg:"draw",render_page:"draw",
  my_memory:"mem",memory_index:"mem",my_digest:"mem",recall:"mem",remember_fact:"mem",
  remember_person:"mem",remember_self:"mem",revise_self:"mem",forget_self:"mem",
  person_dossier:"mem",group_recap:"mem",who_said:"mem",view_avatar:"mem",
  my_status:"self",my_activities:"self",my_adventures:"self",my_capabilities:"self",
  my_changelog:"self",my_source:"self",my_outages:"self",my_schedule:"self",owner_commands:"self",
  exec_sandbox:"code",read_source:"code",
  note_want:"want",my_wants:"want",resolve_want:"want",drop_want:"want",request_feature:"want",
  web_search:"net",web_fetch:"net",hot_news:"net"
};

let pendingMe = "";

function addTool(name){
  let raw = String(name||'').trim();
  if (raw.startsWith('[')) raw = raw.slice(1);
  if (raw.endsWith(']')) raw = raw.slice(0,-1);
  raw = raw.trim();
  const zh = TOOL_ZH[raw] || (/^[a-z0-9_]+$/i.test(raw) ? '某个操作' : raw);
  const kind = TOOL_KIND[raw] || 'other';
  const d = document.createElement('div');
  d.className = 'tool t-' + kind;
  d.textContent = zh;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function add(cls, text){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function addImage(url){
  const wrap = document.createElement('div');
  wrap.className = 'msg her';
  const img = document.createElement('img');
  img.src = url;
  img.style.maxWidth = '180px';
  img.style.borderRadius = '8px';
  img.style.display = 'block';
  wrap.appendChild(img);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

/* 日夜 */
function applyTheme(t){
  if (t === 'light') { document.body.classList.add('light'); themeBtn.textContent = '☀'; }
  else { document.body.classList.remove('light'); themeBtn.textContent = '☾'; }
}
applyTheme(localStorage.getItem('fish-theme') || 'dark');
themeBtn.onclick = () => {
  const now = document.body.classList.contains('light') ? 'dark' : 'light';
  applyTheme(now);
  localStorage.setItem('fish-theme', now);
};

/* 配置 */
let cfgBase = "";
let cfgToken = "";

async function loadCfg(){
  const s = await invoke('get_settings');
  cfgBase = s.base || "";
  cfgToken = s.token || "";
  if (!cfgBase) tip.classList.remove('hide');
  else tip.classList.add('hide');
}

document.getElementById('cfgSave').onclick = async () => {
  const b = document.getElementById('cfgBase').value.trim();
  const t = document.getElementById('cfgToken').value.trim();
  if (!b || !t) { alert('两项都要填'); return; }
  await invoke('save_settings', { base: b.replace(/\/+$/,''), token: t });
  cfgBase = b; cfgToken = t;
  tip.classList.add('hide');
  loadHistory();
  startPoll();
};

/* 历史 */
async function loadHistory(){
  try {
    const r = await invoke('api_get', { path: '/history' });
    if (!r.ok) { st.textContent = r.body.slice(0,40); return; }
    const list = JSON.parse(r.body);
    log.innerHTML = "";
    let lastAt = 0;
    for (const m of list) {
      if (m.at) lastAt = Math.max(lastAt, m.at);
      if (m.image) { addImage(m.image); continue; }
      if (m.role === 'tool') { addTool(m.text || m.tool || ''); continue; }
      if (m.role === 'me') add('me', m.text || '');
      else add('her', m.text || '');
    }
    window.__lastAt = lastAt;
    st.textContent = '';
  } catch (e) {
    st.textContent = '读取失败';
  }
}

/* 发送 */
async function send(){
  const t = inp.value.trim();
  if (!t) return;
  inp.value = '';
  btn.disabled = true;
  add('me', t);
  pendingMe = t;
  try {
    const r = await invoke('api_send', { text: t, from: '' });
    if (!r.ok) addTool('发送失败：' + String(r.body||'').slice(0,40));
  } catch (e) {
    addTool('发送失败');
  }
  setTimeout(() => { btn.disabled = false; }, 400);
}
btn.onclick = send;
inp.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

/* 轮询新消息（每 2 秒） */
let pollTimer = null;
let seenKeys = new Set();

function startPoll(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const r = await invoke('api_get', { path: '/history' });
      if (!r.ok) { dot.classList.remove('on'); st.textContent = '离线'; return; }
      dot.classList.add('on');
      st.textContent = '';
      const list = JSON.parse(r.body);
      for (const m of list) {
        const key = `${m.role}|${m.at||0}|${(m.text||m.image||'').slice(0,30)}`;
        if (seenKeys.has(key)) continue;
        seenKeys.add(key);
        if (seenKeys.size > 600) seenKeys = new Set([...seenKeys].slice(-300));
        // 只追加比上次新的
        if ((m.at || 0) <= (window.__lastAt || 0)) continue;
        window.__lastAt = m.at || window.__lastAt || 0;
        if (m.image) { addImage(m.image); continue; }
        if (m.role === 'tool') { addTool(m.text || m.tool || ''); continue; }
        if (m.role === 'me') {
          if (pendingMe && (m.text||'').includes(pendingMe)) { pendingMe = ''; continue; }
          add('me', m.text || '');
        } else {
          add('her', m.text || '');
        }
      }
    } catch (e) {
      dot.classList.remove('on');
    }
  }, 2000);
}

/* 启动 */
(async () => {
  await loadCfg();
  if (cfgBase) { await loadHistory(); startPoll(); }
})();
</script>
</body>
</html>
